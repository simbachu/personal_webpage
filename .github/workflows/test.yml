name: Tests

on:
  push:
    branches:
      - '**'  # Run on all branches
  pull_request:
    branches:
      - main
      - developing

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      - name: Install dependencies
        run: composer install

      - name: Run smoke tests
        run: vendor/bin/phpunit --testsuite=Smoke

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite=Unit

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite=Integration

      - name: Coverage and Crap4J report
        run: |
          mkdir -p build/coverage
          vendor/bin/phpunit \
            --coverage-text --only-summary-for-coverage-text \
            --coverage-crap4j=build/coverage/crap4j.xml \
            --coverage-clover=build/coverage/clover.xml

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            build/coverage/crap4j.xml
            build/coverage/clover.xml
          if-no-files-found: warn
